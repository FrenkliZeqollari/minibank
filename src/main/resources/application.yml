# All settings can be overridden with environment variables. The defaults below only work
# against the local docker-compose Postgres and are not secrets.
spring:
  application:
    name: ledger-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger}
  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it, it never changes it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  # Only document our own API, not Spring's error and actuator endpoints.
  packages-to-scan: dev.frenkli.ledger.api
  # Do not add the generic error handlers to every operation; each operation lists its own errors.
  override-with-generic-response: false
  # Our responses are JSON; without this the spec says */* ("anything").
  default-produces-media-type: application/json
  swagger-ui:
    # List operations in the order they appear in the code, which follows a customer's journey.
    operations-sorter: method
