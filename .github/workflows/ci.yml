name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Docker is preinstalled on ubuntu-latest, so Testcontainers can start Postgres.
      - name: Build and run all tests
        run: ./mvnw -B verify

      # Unit tests for the frontend's JavaScript (money parsing/formatting). Node's built-in test
      # runner, no npm packages needed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend unit tests
        run: node --test "src/test/js/**/*.test.js"
